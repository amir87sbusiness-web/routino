# For the ArvanCloud VM when you're ready to deploy. NOT used for local
# development or tests — those run against PGlite (Postgres in WASM), so no
# Docker is needed to work on this backend.
#
#   docker compose up -d
#
# Caddy is deliberately included: iOS ATS and Android's cleartext policy both
# require real HTTPS, and Caddy issues certificates automatically. Note that
# Let's Encrypt's ACME endpoints are not always reachable from Iranian IPs, so
# ZeroSSL is configured as a fallback issuer from day one.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-routino}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routino}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only the api container needs it. Never expose Postgres to
    # the internet.
    expose:
      - "5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-routino}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-routino}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Behind Caddy, so forwarded headers are trustworthy here (and only here).
      TRUST_PROXY: "true"
      DB_DRIVER: postgres
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      OTP_PEPPER: ${OTP_PEPPER:?set OTP_PEPPER}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      SMS_PROVIDER: ${SMS_PROVIDER:-kavenegar}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY}
      KAVENEGAR_TEMPLATE: ${KAVENEGAR_TEMPLATE:-routino-otp}
      PSP_PROVIDER: ${PSP_PROVIDER:-zibal}
      ZIBAL_MERCHANT: ${ZIBAL_MERCHANT:-zibal}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL}
      APP_DEEP_LINK: ${APP_DEEP_LINK:-routino://pay/result}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly pg_dump to a DIFFERENT bucket than the frontend's. An untested
  # backup is decoration — run backup/restore.sh against a scratch container
  # before you rely on this.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backup:/backup
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do
         sleep 86400;
         pg_dump -h postgres -U ${POSTGRES_USER:-routino} ${POSTGRES_DB:-routino}
           | gzip > /backup/routino-$$(date +%F).sql.gz;
         find /backup -name '*.sql.gz' -mtime +30 -delete;
       done"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
