# For the ArvanCloud VM when you're ready to deploy. NOT used for local
# development or tests — those run against PGlite (Postgres in WASM), so no
# Docker is needed to work on this backend.
#
#   docker compose up -d
#
# Caddy is deliberately included: iOS ATS and Android's cleartext policy both
# require real HTTPS, and Caddy issues certificates automatically. Note that
# Let's Encrypt's ACME endpoints are not always reachable from Iranian IPs, so
# ZeroSSL is configured as a fallback issuer from day one.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-routino}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routino}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only the api container needs it. Never expose Postgres to
    # the internet.
    expose:
      - "5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-routino}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-routino}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Behind Caddy, so forwarded headers are trustworthy here (and only here).
      TRUST_PROXY: "true"
      DB_DRIVER: postgres
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      OTP_PEPPER: ${OTP_PEPPER:?set OTP_PEPPER}
      ADMIN_PHONE: ${ADMIN_PHONE:?set ADMIN_PHONE}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET}
      SMS_PROVIDER: ${SMS_PROVIDER:-kavenegar}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY}
      KAVENEGAR_TEMPLATE: ${KAVENEGAR_TEMPLATE:-routino-otp}
      PSP_PROVIDER: ${PSP_PROVIDER:-zarinpal}
      ZARINPAL_MERCHANT: ${ZARINPAL_MERCHANT:?set ZARINPAL_MERCHANT}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL}
      APP_DEEP_LINK: ${APP_DEEP_LINK:-routino://pay/result}
      # First-boot owner account, so you can sign in before SMS is live.
      OWNER_PHONE: ${OWNER_PHONE:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_USERNAME: ${OWNER_USERNAME:-}
    expose:
      - "3000"
    # `node -e` rather than curl/wget: the runtime image is node:22-alpine with
    # no HTTP client installed, and Node 22 has a global fetch. Without a
    # healthcheck, Caddy starts proxying to a container that is running but not
    # yet listening, and the first requests after every deploy 502.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Daily pg_dump, uploaded OFF this machine to S3-compatible object storage
  # (ArvanCloud, Liara, Parspack — all speak S3).
  #
  # The upload is the entire point. This used to write only to a local volume,
  # which is not a backup: the most likely way to lose the database is to lose
  # the VM, and that takes a same-VM dump with it. Set S3_* below or the
  # container will say so in its logs on every cycle.
  #
  # Rehearse before you rely on it:
  #   docker compose run --rm backup restore.sh
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-routino}
      POSTGRES_DB: ${POSTGRES_DB:-routino}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      # e.g. https://s3.ir-thr-at1.arvanstorage.ir — and use a DIFFERENT bucket
      # than any public/frontend one, since these dumps hold every user's data.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - backup_data:/backup

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  # A named volume, not a bind mount: the dumps contain every user's data and
  # have no business sitting in the source tree next to the code.
  backup_data:
