apply plugin: 'com.android.application'

// امضای نسخه‌ی release از روی android/keystore.properties خوانده می‌شود.
// نسخه‌ی release بدون این کلید نباید ساخته شود؛ APK بدون امضا قابل انتشار نیست.
def keystorePropsFile = rootProject.file("keystore.properties")
def hasKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
if (releaseRequested && !hasKeystore) {
    throw new GradleException("Release signing is missing. Run: npm run android:signing:init")
}

android {
    namespace "com.routino.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.routino.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// ---------------------------------------------------------------------------
// بیلد و سینکِ خودکارِ وب‌اپ قبل از هر بیلد اندروید.
// با این کار هر بار در Android Studio دکمه‌ی Run را بزنی، آخرین نسخه‌ی کدِ وب
// (پوشه‌ی src) دوباره ساخته و داخل اپ اندروید کپی می‌شود؛ نتیجه یک اپ کاملاً
// مستقل و آفلاین روی گوشی است (فایل‌های وب داخل خود APK بسته‌بندی می‌شوند).
//
// برای رد کردن این مرحله (مثلاً وقتی Node در دسترس نیست یا در CI):
//     gradlew :app:assembleDebug -PskipWebBuild
// ---------------------------------------------------------------------------
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def webAppRoot = file("${projectDir}/../..")

tasks.register('capBuildWeb', Exec) {
    group = 'capacitor'
    description = 'ساخت وب‌اپ برای موبایل (خروجی در www/)'
    workingDir webAppRoot
    // فقط وقتی کد وب تغییر کرده باشد دوباره اجرا می‌شود تا Run سریع بماند.
    inputs.dir("${webAppRoot}/src").withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file("${webAppRoot}/index.html")
    inputs.file("${webAppRoot}/package.json")
    inputs.file("${webAppRoot}/vite.config.ts")
    outputs.dir("${webAppRoot}/www")
    if (isWindows) {
        commandLine 'cmd', '/c', 'npm', 'run', 'build:mobile'
    } else {
        commandLine 'npm', 'run', 'build:mobile'
    }
}

tasks.register('capCopyWeb', Exec) {
    group = 'capacitor'
    description = 'کپی www/ به داخل اپ اندروید (cap copy)'
    dependsOn 'capBuildWeb'
    workingDir webAppRoot
    if (isWindows) {
        commandLine 'cmd', '/c', 'npx', 'cap', 'copy', 'android'
    } else {
        commandLine 'npx', 'cap', 'copy', 'android'
    }
}

if (!project.hasProperty('skipWebBuild')) {
    afterEvaluate {
        tasks.named('preBuild').configure {
            dependsOn 'capCopyWeb'
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
