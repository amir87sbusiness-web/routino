# Temporary validation workflow for the lifetime analytics branch.
name: lifetime-user-analytics-ci

on:
  push:
    branches:
      - codex/lifetime-user-analytics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend-only runtime dependencies ephemerally
        run: |
          npm install --no-save --package-lock=false \
            @fastify/compress@^8.0.1 \
            @fastify/cors@^10.0.1 \
            @fastify/helmet@^13.0.1 \
            @fastify/rate-limit@^10.2.1 \
            fastify@^5.2.1 \
            fastify-plugin@^6.0.0 \
            pg@^8.13.1 \
            @types/pg@^8.11.10

      - name: Targeted lifetime analytics migration test
        run: cd backend && ../node_modules/.bin/vitest run lifetime-user-analytics-sql.test.ts --maxWorkers=1

      - name: Full backend tests
        run: cd backend && ../node_modules/.bin/vitest run --maxWorkers=1

      - name: Backend typecheck
        run: cd backend && ../node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: Frontend/root tests
        run: npm test -- --maxWorkers=1

      - name: Sync generated Edge shared sources
        run: npm run sync:edge

      - name: Assert Edge generated sources were already in parity
        run: git diff --exit-code

      - name: Edge tests
        run: npm run test:edge -- --maxWorkers=1

      - name: Production web build
        run: npm run build
