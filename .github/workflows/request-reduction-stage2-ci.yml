name: Request reduction stage 2 validation

on:
  push:
    branches:
      - chatgpt/request-reduction-stage2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Align lifecycle timing tests with production constants
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const appPath = 'src/state/app-sync.test.tsx';
          let app = fs.readFileSync(appPath, 'utf8');
          app = app.replaceAll('vi.advanceTimersByTime(30_000)', 'vi.advanceTimersByTime(45_000)');
          fs.writeFileSync(appPath, app);

          const schedulerPath = 'src/lib/sync/scheduler.test.ts';
          let scheduler = fs.readFileSync(schedulerPath, 'utf8');
          scheduler = scheduler
            .replace('uses a trailing thirty-second edit window', 'uses a trailing forty-five-second edit window')
            .replace('coalesces redundant clean foreground pulls for three minutes', 'coalesces redundant clean foreground pulls for five minutes')
            .replace('skips a clean boot pull when the shared cursor was synced within two minutes', 'skips a clean boot pull when the shared cursor was synced within three minutes');
          fs.writeFileSync(schedulerPath, scheduler);
          NODE
      - name: Commit timing test alignment
        shell: bash
        run: |
          if ! git diff --quiet -- src/state/app-sync.test.tsx src/lib/sync/scheduler.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/state/app-sync.test.tsx src/lib/sync/scheduler.test.ts
            git commit -m "test: align stage 2 sync timings"
            git push origin HEAD:chatgpt/request-reduction-stage2
          fi
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Prettier check
        run: npx prettier --check src/lib/sync/scheduler.ts src/lib/sync/scheduler.test.ts src/state/app-sync.test.tsx src/lib/api/payments.ts supabase/migrations/20260915190000_reduce_background_request_cadence_stage2.sql
      - name: Lint
        run: npm run lint
      - name: Root typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Root unused-symbol check
        run: npx tsc --noEmit -p tsconfig.json --noUnusedLocals --noUnusedParameters
      - name: Frontend tests
        run: npm test
      - name: Frontend and landing build
        run: npm run build
      - name: Backend typecheck
        run: npm --prefix backend run typecheck
      - name: Backend unused-symbol check
        run: cd backend && npx tsc --noEmit -p tsconfig.json --noUnusedLocals --noUnusedParameters
      - name: Backend tests
        run: npm --prefix backend test -- --maxWorkers=1
      - name: Sync canonical backend into Edge
        run: npm run sync:edge
      - name: Assert Edge generated parity is committed
        run: git diff --exit-code -- supabase/functions/api/shared
      - name: Edge tests
        run: npm run test:edge
      - name: Production dependency audit (root)
        run: npm audit --omit=dev --audit-level=high
      - name: Production dependency audit (backend)
        run: npm --prefix backend audit --omit=dev --audit-level=high
      - name: Mobile Capacitor sync
        run: npm run cap:sync
      - name: Android debug compile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PskipWebBuild
