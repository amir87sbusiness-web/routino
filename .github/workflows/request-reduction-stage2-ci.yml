name: Request reduction stage 2 validation

on:
  push:
    branches:
      - chatgpt/request-reduction-stage2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: |
          npm install --global npm@11.6.0
          rm -rf node_modules
          rm -f package-lock.json
          npm install --no-package-lock
      - name: Prettier check
        run: npx prettier --check src/lib/sync/scheduler.ts src/lib/sync/scheduler.test.ts src/state/app-sync.test.tsx src/lib/api/payments.ts
      - name: Lint changed source
        run: npx eslint src/lib/sync/scheduler.ts src/lib/sync/scheduler.test.ts src/state/app-sync.test.tsx src/lib/api/payments.ts
      - name: Root typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Root unused-symbol check
        run: npx tsc --noEmit -p tsconfig.json --noUnusedLocals --noUnusedParameters
      - name: Frontend tests
        run: npm test
      - name: Frontend and landing build
        run: npm run build
      - name: Backend typecheck
        run: npm --prefix backend run typecheck
      - name: Backend unused-symbol check
        run: cd backend && npx tsc --noEmit -p tsconfig.json --noUnusedLocals --noUnusedParameters
      - name: Backend tests
        run: npm --prefix backend test -- --maxWorkers=1
      - name: Sync canonical backend into Edge
        run: npm run sync:edge
      - name: Assert Edge generated parity is committed
        run: git diff --exit-code -- supabase/functions/api/shared
      - name: Edge tests
        run: npm run test:edge
      - name: Production dependency audit (root)
        run: npm audit --omit=dev --audit-level=high
      - name: Production dependency audit (backend)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high --package-lock=false
      - name: Mobile Capacitor sync
        run: npm run cap:sync
      - name: Android debug compile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PskipWebBuild
