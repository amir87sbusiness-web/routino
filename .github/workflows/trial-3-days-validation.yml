name: Trial 3 Days Validation

on:
  push:
    branches:
      - codex/trial-3-days
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/trial-3-days
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync generated Edge shared sources
        run: node -e "import('./scripts/sync-edge-shared.mjs').then((m) => m.syncAll())"

      - name: Regenerate setup SQL
        run: node scripts/gen-setup-sql.mjs

      - name: Sync activation design preview to three-day copy
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/superpowers/previews/activation-paywall.html';
          let text = fs.readFileSync(path, 'utf8');
          const replacements = [
            ['هفت روز با روتینو پیش برو', 'سه روز با روتینو پیش برو'],
            ['تمام امکانات برای هفت روز فعال می‌شود', 'تمام امکانات برای سه روز فعال می‌شود'],
            ['بعد از هفت روز', 'بعد از سه روز'],
            ['Try a week with Routino', 'Try Routino for three days'],
            ['Every feature unlocks for seven days', 'Every feature unlocks for three days'],
            ['After seven days', 'After three days'],
          ];
          for (const [from, to] of replacements) text = text.replaceAll(from, to);
          fs.writeFileSync(path, text);
          NODE

      - name: Format trial-change files
        run: |
          npx prettier --write \
            backend/src/db/ddl.ts \
            backend/src/services/entitlement.ts \
            backend/test/account-retention-sql.test.ts \
            backend/test/entitlement.test.ts \
            backend/test/subscriptions.test.ts \
            scripts/generate-icons.test.mjs \
            src/lib/api/auth.ts \
            src/lib/legal-text.json \
            src/lib/subscription-progress.test.ts \
            src/lib/subscription-progress.ts \
            src/routes/-activation.test.tsx \
            src/routes/activation.tsx \
            src/routes/subscribe.tsx \
            supabase/functions/api/shared/db/ddl.ts \
            supabase/functions/api/shared/services/entitlement.ts \
            supabase/tests/subscriptions.test.ts

      - name: Commit deterministic and formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/db/ddl.ts \
            backend/src/services/entitlement.ts \
            backend/test/account-retention-sql.test.ts \
            backend/test/entitlement.test.ts \
            backend/test/subscriptions.test.ts \
            scripts/generate-icons.test.mjs \
            src/lib/api/auth.ts \
            src/lib/legal-text.json \
            src/lib/subscription-progress.test.ts \
            src/lib/subscription-progress.ts \
            src/routes/-activation.test.tsx \
            src/routes/activation.tsx \
            src/routes/subscribe.tsx \
            supabase/functions/api/shared \
            supabase/setup.sql \
            supabase/tests/subscriptions.test.ts \
            docs/superpowers/previews/activation-paywall.html
          if ! git diff --cached --quiet; then
            git commit -m "Format three-day trial changes"
            git push origin HEAD:codex/trial-3-days
          fi

      - name: Unit tests
        run: npm test

      - name: Edge tests
        run: npm run test:edge

      - name: Lint changed JavaScript and TypeScript
        run: |
          files=$(git diff --name-only origin/main...HEAD -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx')
          if [ -n "$files" ]; then
            npx eslint $files
          fi

      - name: Prettier check changed source files
        run: |
          files=$(git diff --name-only origin/main...HEAD -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.json' '*.md' '*.yml' '*.yaml')
          if [ -n "$files" ]; then
            npx prettier --check $files
          fi

      - name: Build
        run: npm run build

      - name: Audit stale trial-policy copy
        run: |
          set -e
          ! grep -R -n -E 'Try a week with Routino|Every feature unlocks for seven days|After seven days|هفت روز با روتینو پیش برو|تمام امکانات برای هفت روز فعال می‌شود|بعد از هفت روز' \
            src backend supabase/functions docs landing || {
              echo "Found stale user-facing seven-day trial copy"
              exit 1
            }
          ! grep -R -n -E 'endAt - 7 \* DAY_MS|g\.days = 7' \
            src backend/src supabase/functions || {
              echo "Found stale runtime seven-day trial formula"
              exit 1
            }
