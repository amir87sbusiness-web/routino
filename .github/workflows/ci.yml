name: CI

on:
  push:
    branches:
      - main
      - fix/production-recovery-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Verify generated Edge shared code
        run: |
          npm run sync:edge
          git diff --exit-code -- supabase/functions/api/shared

      - name: Frontend and shared tests
        run: npm test

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Backend tests
        run: npm --prefix backend test

      - name: Edge tests
        run: npm run test:edge

      - name: Lint
        run: npm run lint

      - name: Build web and landing
        run: npm run build

      - name: Production dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix backend audit --omit=dev --audit-level=high
