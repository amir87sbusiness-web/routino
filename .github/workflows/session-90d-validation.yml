name: Session 90d final validation

on:
  push:
    branches:
      - session-90d-silent-renewal

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm --prefix backend install
      - name: Format session files
        run: npx prettier --write backend/test/session-refresh.test.ts src/lib/api/auth.ts supabase/tests/session-refresh.test.ts
      - name: Commit formatting if needed
        run: |
          git add backend/test/session-refresh.test.ts src/lib/api/auth.ts supabase/tests/session-refresh.test.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format session renewal changes"
            git push origin HEAD:session-90d-silent-renewal
          fi
      - name: Prettier check changed session files
        run: npx prettier --check backend/src/env.ts backend/src/routes/auth.ts backend/src/services/tokens.ts backend/test/session-refresh.test.ts backend/test/tokens.test.ts src/lib/api/auth.ts src/lib/api/auth-expiry.test.ts supabase/functions/api/routes/auth.ts supabase/functions/api/shared/env.ts supabase/functions/api/shared/services/tokens.ts supabase/tests/session-refresh.test.ts
      - name: Lint
        run: npm run lint
      - name: Root typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Root unused-symbol check
        run: npx tsc --noEmit -p tsconfig.json --noUnusedLocals --noUnusedParameters
      - name: Frontend tests
        run: npm test
      - name: Frontend and landing build
        run: npm run build
      - name: Backend typecheck
        run: npm --prefix backend run typecheck
      - name: Backend unused-symbol check
        run: cd backend && npx tsc --noEmit -p tsconfig.json --noUnusedLocals --noUnusedParameters
      - name: Backend tests
        run: npm --prefix backend test -- --maxWorkers=1
      - name: Sync canonical backend into Edge
        run: npm run sync:edge
      - name: Assert Edge generated parity is committed
        run: git diff --exit-code -- supabase/functions/api/shared
      - name: Edge tests
        run: npm run test:edge
      - name: Mobile Capacitor sync
        run: npm run cap:sync
      - name: Android debug compile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
