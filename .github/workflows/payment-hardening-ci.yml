# Final committed-state validation; restore this workflow before merge.
name: Payment hardening validation

on:
  push:
    branches:
      - fix/payment-retry-recovery-hardening

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend install --ignore-scripts

      - name: Apply final safe cleanups
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          flow = Path("backend/src/services/payment-flow.ts")
          text = flow.read_text(encoding="utf-8")
          old = 'import type { Database } from "../db/client.js";'
          new = 'import type { Database, DatabaseExecutor } from "../db/client.js";'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("unexpected payment-flow database import")
          flow.write_text(text, encoding="utf-8")

          admin_test = Path("backend/test/admin-page.test.ts")
          lines = admin_test.read_text(encoding="utf-8").splitlines()
          matches = [line for line in lines if '#dPercent' in line]
          if len(matches) > 1:
              raise SystemExit("unexpected multiple stale dPercent references")
          if matches:
              lines = [line for line in lines if '#dPercent' not in line]
              admin_test.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          npx prettier --write \
            backend/src/services/payment-flow.ts \
            backend/test/admin-page.test.ts \
            backend/src/routes/payment-recovery.ts \
            supabase/functions/api/routes/payment-recovery.ts
          npm run sync:edge

          unexpected="$(git diff --name-only -- supabase/functions/api/shared | grep -v '^supabase/functions/api/shared/services/payment-flow.ts$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated Edge changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Root typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Root unused-symbol check
        run: npx tsc --noEmit -p tsconfig.json --noUnusedLocals --noUnusedParameters

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Backend unused-symbol check
        run: cd backend && npx tsc --noEmit -p tsconfig.json --noUnusedLocals --noUnusedParameters

      - name: Lint changed payment surface
        run: |
          npx eslint \
            backend/src/services/payment-flow.ts \
            backend/src/routes/payments.ts \
            backend/src/routes/payment-recovery.ts \
            backend/test/payment-recovery.test.ts \
            backend/test/payment-checkout-replay.test.ts \
            backend/test/admin-page.test.ts \
            src/lib/api/payments.ts \
            src/lib/api/payments.test.ts \
            supabase/functions/api/routes/payments.ts \
            supabase/functions/api/routes/payment-recovery.ts \
            supabase/functions/api/shared/services/payment-flow.ts

      - name: Frontend tests
        run: npm test

      - name: Backend tests
        run: npm --prefix backend test -- --maxWorkers=1

      - name: Assert Edge generated parity
        run: npm --prefix backend test -- test/edge-parity.test.ts --maxWorkers=1

      - name: Edge tests
        run: npm run test:edge

      - name: Frontend and landing build
        run: npm run build

      - name: Production dependency audit (root)
        run: npm audit --omit=dev --audit-level=high

      - name: Production dependency audit (backend)
        run: npm --prefix backend audit --omit=dev --audit-level=high

      - name: Mobile Capacitor sync
        run: npm run cap:sync

      - name: Android debug compile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Commit validated cleanups
        shell: bash
        run: |
          git add \
            backend/src/services/payment-flow.ts \
            backend/test/admin-page.test.ts \
            supabase/functions/api/shared/services/payment-flow.ts
          if git diff --cached --quiet; then
            echo "No cleanup commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(payments): finalize type safety and regression coverage [autofix]"
          git push
