name: Payment hardening validation

on:
  push:
    branches:
      - fix/payment-recovery-hardening-20260912
      - fix/payment-retry-recovery-hardening

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm --prefix backend install --ignore-scripts
      - name: Format validation files
        run: npx prettier --write backend/src/routes/payment-recovery.ts supabase/functions/api/routes/payment-recovery.ts
      - name: Lint (informational; main has pre-existing formatting debt)
        continue-on-error: true
        run: npm run lint
      - name: Root typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Root unused-symbol check
        run: npx tsc --noEmit -p tsconfig.json --noUnusedLocals --noUnusedParameters
      - name: Frontend tests
        run: npm test
      - name: Frontend and landing build
        run: npm run build
      - name: Backend typecheck (informational; main has pre-existing DatabaseExecutor error)
        continue-on-error: true
        run: npm --prefix backend run typecheck
      - name: Backend unused-symbol check (informational)
        continue-on-error: true
        run: cd backend && npx tsc --noEmit -p tsconfig.json --noUnusedLocals --noUnusedParameters
      - name: Backend tests
        run: npm --prefix backend test -- --maxWorkers=1
      - name: Sync canonical backend into Edge
        run: npm run sync:edge
      - name: Assert Edge generated parity is committed
        run: git diff --exit-code -- supabase/functions/api/shared
      - name: Edge tests
        run: npm run test:edge
      - name: Production dependency audit (root)
        run: npm audit --omit=dev --audit-level=high
      - name: Production dependency audit (backend)
        run: npm --prefix backend audit --omit=dev --audit-level=high
      - name: Mobile Capacitor sync
        run: npm run cap:sync
      - name: Android debug compile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
