name: Validate trial 3 days repair

on:
  push:
    branches:
      - codex/trial-3-days
    paths:
      - '.github/workflows/review-trial-3-days.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies using committed lockfiles
        run: |
          npm ci
          npm --prefix backend ci

      - name: Verify generated Edge and setup SQL are in sync
        shell: bash
        run: |
          set -euo pipefail
          node -e "import('./scripts/sync-edge-shared.mjs').then((m) => m.syncAll())"
          node scripts/gen-setup-sql.mjs
          git diff --exit-code -- backend/src supabase/functions/api/shared supabase/setup.sql

      - name: Full frontend and shared tests
        run: npm test

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Full backend tests
        run: npm --prefix backend test -- --maxWorkers=1

      - name: Edge parity tests
        run: npm run test:edge

      - name: Lint
        run: npm run lint

      - name: Build web and landing
        run: npm run build

      - name: Production dependency audits
        run: |
          npm audit --omit=dev
          npm --prefix backend audit --omit=dev

      - name: Trial policy and data-safety static audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'Try a week with Routino|Every feature unlocks for seven days|After seven days|هفت روز با روتینو پیش برو|تمام امکانات برای هفت روز فعال می‌شود|بعد از هفت روز' src backend/src supabase/functions landing docs; then
            echo 'stale user-facing 7-day trial copy found'
            exit 1
          fi
          if grep -R -n -E 'endAt - 7 \* DAY_MS|g\.days = 7' src backend/src supabase/functions; then
            echo 'stale runtime 7-day trial formula found'
            exit 1
          fi
          count=$(grep -R -n -E 'planId: ["'"']trial["'"'], days: 3, source: ["'"']trial["'"']' backend/src supabase/functions/api/shared | wc -l)
          test "$count" -ge 2
          test "$(grep -c 'new Date(NOW).getTime() + 3 \* DAY' backend/test/account-retention.test.ts)" -ge 1
          test "$(grep -c 'toBe(3 \* DAY)' backend/test/account-retention.test.ts)" -ge 1
          test "$(grep -c 'versionCode 8' scripts/generate-icons.test.mjs)" -ge 1
          git diff --exit-code
