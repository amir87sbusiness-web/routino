name: Repair trial 3 days review findings

on:
  push:
    branches:
      - codex/trial-3-days
    paths:
      - '.github/workflows/review-trial-3-days.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Apply narrowly scoped repo-only fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              'backend/test/account-retention.test.ts',
              'new Date(NOW).getTime() + 7 * DAY',
              'new Date(NOW).getTime() + 3 * DAY',
          )
          replace(
              'backend/test/account-retention.test.ts',
              'with a fresh seven-day trial',
              'with a fresh three-day trial',
          )
          replace(
              'backend/test/account-retention.test.ts',
              ').toBe(7 * DAY);',
              ').toBe(3 * DAY);',
          )
          replace(
              'scripts/generate-icons.test.mjs',
              'assert.match(gradle, /versionCode 6\\b/);',
              'assert.match(gradle, /versionCode 8\\b/);',
          )
          replace(
              'supabase/tests/launch-stress-sync.test.ts',
              'let now = Date.now();',
              'const now = Date.now();',
          )
          replace(
              'supabase/tests/launch-stress-auth-payment.test.ts',
              '  const orders = [];',
              '  const orders: { paymentId: string; authority: string }[] = [];',
          )
          replace(
              'supabase/tests/launch-stress-auth-payment.test.ts',
              '  for (const user of people) orders.push(await (await call("/v1/payments/checkout", { planId: "m1", attemptId: randomUUID() }, auth(user.access))).json());',
              '  for (const user of people) {\n    orders.push(\n      (await (await call("/v1/payments/checkout", { planId: "m1", attemptId: randomUUID() }, auth(user.access))).json()) as { paymentId: string; authority: string },\n    );\n  }',
          )
          replace(
              'supabase/tests/launch-stress-auth-payment.test.ts',
              '  const callback = (order: any) => () => call(`/v1/payments/callback?paymentId=${order.paymentId}&Authority=${order.authority}&Status=OK`);',
              '  const callback = (order: { paymentId: string; authority: string }) => () =>\n    call(`/v1/payments/callback?paymentId=${order.paymentId}&Authority=${order.authority}&Status=OK`);',
          )
          PY

      - name: Format only files reported by lint
        run: |
          npx prettier --write \
            backend/test/payment-recovery.test.ts \
            backend/test/account-retention.test.ts \
            scripts/generate-icons.mjs \
            scripts/generate-icons.test.mjs \
            supabase/tests/launch-stress-auth-payment.test.ts \
            supabase/tests/launch-stress-sync.test.ts

      - name: Regenerate backend lockfile without changing package manifest
        shell: bash
        run: |
          set -euo pipefail
          cp backend/package.json /tmp/backend-package.json
          npm --prefix backend install --package-lock-only --ignore-scripts
          cmp backend/package.json /tmp/backend-package.json
          npm --prefix backend ci --ignore-scripts

      - name: Show production dependency audit only
        shell: bash
        run: |
          set +e
          echo '--- root production audit ---'
          npm audit --omit=dev
          echo '--- backend production audit ---'
          npm --prefix backend audit --omit=dev
          exit 0

      - name: Commit repo-only fixes to review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/test/payment-recovery.test.ts \
            backend/test/account-retention.test.ts \
            backend/package-lock.json \
            scripts/generate-icons.mjs \
            scripts/generate-icons.test.mjs \
            supabase/tests/launch-stress-auth-payment.test.ts \
            supabase/tests/launch-stress-sync.test.ts
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git commit -m 'Fix review findings without touching production data'
          git push origin HEAD:codex/trial-3-days
