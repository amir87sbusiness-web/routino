name: Final static audit for trial 3 days repair

on:
  push:
    branches:
      - codex/trial-3-days
    paths:
      - '.github/workflows/review-trial-3-days.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trial policy and data-safety static audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('src'), Path('backend/src'), Path('supabase/functions'), Path('landing'), Path('docs')]
          text = '\n'.join(
              p.read_text(errors='ignore')
              for root in roots if root.exists()
              for p in root.rglob('*') if p.is_file()
          )
          stale_copy = [
              'Try a week with Routino',
              'Every feature unlocks for seven days',
              'After seven days',
              'هفت روز با روتینو پیش برو',
              'تمام امکانات برای هفت روز فعال می‌شود',
              'بعد از هفت روز',
          ]
          assert not any(s in text for s in stale_copy), 'stale user-facing 7-day trial copy found'
          assert 'endAt - 7 * DAY_MS' not in text, 'stale runtime 7-day progress formula found'
          assert 'g.days = 7' not in text, 'stale runtime 7-day retention predicate found'

          backend = Path('backend/src/services/entitlement.ts').read_text()
          edge = Path('supabase/functions/api/shared/services/entitlement.ts').read_text()
          marker = 'planId: "trial", days: 3, source: "trial"'
          assert marker in backend and marker in edge, '3-day canonical trial grant missing'

          retention_test = Path('backend/test/account-retention.test.ts').read_text()
          assert 'new Date(NOW).getTime() + 3 * DAY' in retention_test
          assert ').toBe(3 * DAY);' in retention_test
          assert 'fresh three-day trial' in retention_test

          icon_test = Path('scripts/generate-icons.test.mjs').read_text()
          assert 'versionCode 8' in icon_test
          print('static trial/data-safety audit passed')
          PY
          git diff --exit-code
