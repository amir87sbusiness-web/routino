name: Onboarding branch validation

on:
  push:
    branches:
      - chatgpt/new-user-onboarding

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Frontend tests
        run: npm test
      - name: Build
        run: npm run build
