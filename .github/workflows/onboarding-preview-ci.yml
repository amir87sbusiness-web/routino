name: Onboarding branch validation

on:
  push:
    branches:
      - chatgpt/new-user-onboarding

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format onboarding files
        run: |
          npx prettier --write \
            src/components/OnboardingFlow.tsx \
            src/lib/onboarding.ts \
            src/routes/getting-started.tsx \
            src/routes/auth.tsx \
            src/routes/activation.tsx \
            src/routes/onboarding.tsx \
            src/routeTree.gen.ts
          if ! git diff --quiet -- src/components/OnboardingFlow.tsx src/lib/onboarding.ts src/routes/getting-started.tsx src/routes/auth.tsx src/routes/activation.tsx src/routes/onboarding.tsx src/routeTree.gen.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/OnboardingFlow.tsx src/lib/onboarding.ts src/routes/getting-started.tsx src/routes/auth.tsx src/routes/activation.tsx src/routes/onboarding.tsx src/routeTree.gen.ts
            git commit -m "style: format onboarding files [skip ci]"
            git push origin HEAD:chatgpt/new-user-onboarding
          fi
      - name: Lint onboarding scope
        run: npx eslint src/components/OnboardingFlow.tsx src/lib/onboarding.ts src/routes/getting-started.tsx src/routes/auth.tsx src/routes/activation.tsx src/routes/onboarding.tsx
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Frontend tests
        run: npm test
      - name: Build
        run: npm run build
