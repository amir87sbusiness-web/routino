name: Deploy trial 3 days API

on:
  push:
    branches:
      - codex/trial-3-days
    paths:
      - '.github/workflows/deploy-trial-3-days.yml'
      - 'supabase/functions/api/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: axychfrteevhfdhgvfuv
    steps:
      - uses: actions/checkout@v4
      - name: Require Supabase token
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy API
        run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
