name: Android Release

on:
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Require the existing Routino release signer
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/routino-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          cat > android/keystore.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/keystore.properties

      - run: npm ci

      - name: Build and verify signed APK
        run: npm run android:release

      - name: Prepare stable release assets
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -n1)"
          test -n "$VERSION"
          SRC="output/android/routino-android-${VERSION}.apk"
          test -f "$SRC"
          mkdir -p release-assets
          cp "$SRC" release-assets/routino-android.apk
          cp "$SRC.sha256" release-assets/routino-android.apk.sha256
          cp "$SRC.json" release-assets/routino-android.apk.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: routino-android-${{ steps.version.outputs.version }}
          path: release-assets/
          if-no-files-found: error

      - name: Publish or update latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --latest --title "Routino Android ${VERSION}"
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Routino Android ${VERSION}" \
              --notes "Signed Routino Android ${VERSION} (versionCode ${VERSION_CODE})." \
              --latest
          fi
