name: Request reduction validation

on:
  push:
    branches:
      - chatgpt/reduce-server-requests

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm --prefix backend install --no-audit --no-fund
      - name: Format changed sources
        run: |
          FILES="src/lib/sync/scheduler.ts src/lib/sync/scheduler.test.ts src/lib/api/payments.ts backend/src/routes/payments.ts backend/test/payment-quote-batch.test.ts supabase/functions/api/routes/payments.ts"
          npx prettier --write $FILES
          if ! git diff --quiet -- $FILES; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "style: format request reduction changes"
            git push origin HEAD:chatgpt/reduce-server-requests
          fi
      - name: Lint changed sources
        run: >-
          npx eslint
          src/lib/sync/scheduler.ts
          src/lib/sync/scheduler.test.ts
          src/lib/api/payments.ts
          backend/src/routes/payments.ts
          backend/test/payment-quote-batch.test.ts
          supabase/functions/api/routes/payments.ts
      - name: Root typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Frontend tests
        run: npm test
      - name: Frontend and landing build
        run: npm run build
      - name: Backend typecheck
        run: npm --prefix backend run typecheck
      - name: Backend tests
        run: npm --prefix backend test -- --maxWorkers=1
      - name: Sync canonical backend into Edge
        run: npm run sync:edge
      - name: Assert generated Edge shared parity
        run: git diff --exit-code -- supabase/functions/api/shared
      - name: Edge tests
        run: npm run test:edge
