name: Request reduction validation

on:
  push:
    branches:
      - chatgpt/reduce-server-requests

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm --prefix backend install --no-audit --no-fund
      - name: Finalize conservative request reduction constants
        run: |
          ENGINE=src/lib/sync/engine.ts
          OLD_CHUNK='const MAX_CHUNK_RECORDS = 100;'
          NEW_CHUNK='const MAX_CHUNK_RECORDS = 180;'
          OLD_CHUNK_COUNT=$(grep -Fxc "$OLD_CHUNK" "$ENGINE" || true)
          if [ "$OLD_CHUNK_COUNT" -eq 1 ]; then
            sed -i 's/const MAX_CHUNK_RECORDS = 100;/const MAX_CHUNK_RECORDS = 180;/' "$ENGINE"
          elif ! grep -Fqx "$NEW_CHUNK" "$ENGINE"; then
            echo "MAX_CHUNK_RECORDS was not in the expected old/new state" >&2
            exit 1
          fi

          PAYMENTS=src/lib/api/payments.ts
          OLD_CACHE='  if (!value.offer || value.offer.until <= now) return normalExpiry;'
          NEW_CACHE='  if (!value.offer) return normalExpiry;'
          OLD_CACHE_COUNT=$(grep -Fxc "$OLD_CACHE" "$PAYMENTS" || true)
          if [ "$OLD_CACHE_COUNT" -eq 1 ]; then
            sed -i 's/  if (!value\.offer || value\.offer\.until <= now) return normalExpiry;/  if (!value.offer) return normalExpiry;\n  if (value.offer.until <= now) return now;/' "$PAYMENTS"
          elif ! grep -Fqx "$NEW_CACHE" "$PAYMENTS"; then
            echo "Plan cache expiry guard was not in the expected old/new state" >&2
            exit 1
          fi

          SOURCE_FILES="$ENGINE $PAYMENTS"
          if ! git diff --quiet -- $SOURCE_FILES; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npx prettier --write $SOURCE_FILES
            git add $SOURCE_FILES
            git commit -m "perf: finish conservative request batching"
            git push origin HEAD:chatgpt/reduce-server-requests
          fi
      - name: Align lifecycle tests with reduced sync cadence
        run: |
          TEST_FILE=src/state/app-sync.test.tsx
          OLD_TIMER='vi.advanceTimersByTime(10_000)'
          OLD_COUNT=$(grep -oF "$OLD_TIMER" "$TEST_FILE" | wc -l || true)
          if [ "$OLD_COUNT" -eq 4 ]; then
            sed -i 's/vi\.advanceTimersByTime(10_000)/vi.advanceTimersByTime(30_000)/g' "$TEST_FILE"
          elif [ "$OLD_COUNT" -ne 0 ]; then
            echo "Expected 0 or 4 old 10s sync timers, found $OLD_COUNT" >&2
            exit 1
          fi

          OLD_LOGIN='    expect(mocks.syncNow).toHaveBeenLastCalledWith("user-b", { pullRequired: true });'
          NEW_LOGIN='    expect(mocks.syncNow).toHaveBeenCalledTimes(1);'
          OLD_LOGIN_COUNT=$(grep -Fxc "$OLD_LOGIN" "$TEST_FILE" || true)
          if [ "$OLD_LOGIN_COUNT" -eq 1 ]; then
            sed -i 's/    expect(mocks\.syncNow)\.toHaveBeenLastCalledWith("user-b", { pullRequired: true });/    expect(mocks.syncNow).toHaveBeenCalledTimes(1);/' "$TEST_FILE"
          elif ! grep -Fq "$NEW_LOGIN" "$TEST_FILE"; then
            echo "Post-login sync expectation did not match expected old/new forms" >&2
            exit 1
          fi

          if ! git diff --quiet -- "$TEST_FILE"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npx prettier --write "$TEST_FILE"
            git add "$TEST_FILE"
            git commit -m "test: align lifecycle sync expectations with lower request cadence"
            git push origin HEAD:chatgpt/reduce-server-requests
          fi
      - name: Format changed sources
        run: |
          FILES="src/lib/sync/engine.ts src/lib/sync/scheduler.ts src/lib/sync/scheduler.test.ts src/lib/api/payments.ts backend/src/routes/payments.ts backend/test/payment-quote-batch.test.ts supabase/functions/api/routes/payments.ts src/state/app-sync.test.tsx"
          npx prettier --write $FILES
          if ! git diff --quiet -- $FILES; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "style: format request reduction changes"
            git push origin HEAD:chatgpt/reduce-server-requests
          fi
      - name: Lint changed sources
        run: >-
          npx eslint
          src/lib/sync/engine.ts
          src/lib/sync/scheduler.ts
          src/lib/sync/scheduler.test.ts
          src/lib/api/payments.ts
          src/state/app-sync.test.tsx
          backend/src/routes/payments.ts
          backend/test/payment-quote-batch.test.ts
          supabase/functions/api/routes/payments.ts
      - name: Root typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Frontend tests
        run: npm test
      - name: Frontend and landing build
        run: npm run build
      - name: Backend typecheck
        run: npm --prefix backend run typecheck
      - name: Backend tests
        run: npm --prefix backend test -- --maxWorkers=1
      - name: Sync canonical backend into Edge
        run: npm run sync:edge
      - name: Assert generated Edge shared parity
        run: git diff --exit-code -- supabase/functions/api/shared
      - name: Edge tests
        run: npm run test:edge
