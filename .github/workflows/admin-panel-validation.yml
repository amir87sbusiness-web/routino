name: Admin Panel Validation

on:
  push:
    branches:
      - validation/admin-panel-ci

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Format admin browser files
        run: |
          npx prettier --write \
            backend/src/lib/admin-user-list-ui.ts \
            backend/src/services/admin-user-list.ts \
            backend/test/admin-user-list-ui.test.ts \
            backend/test/admin-user-list.test.ts \
            supabase/functions/api/shared/lib/admin-user-list-ui.ts \
            supabase/functions/api/shared/services/admin-user-list.ts

      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- \
            backend/src/lib/admin-user-list-ui.ts \
            backend/src/services/admin-user-list.ts \
            backend/test/admin-user-list-ui.test.ts \
            backend/test/admin-user-list.test.ts \
            supabase/functions/api/shared/lib/admin-user-list-ui.ts \
            supabase/functions/api/shared/services/admin-user-list.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              backend/src/lib/admin-user-list-ui.ts \
              backend/src/services/admin-user-list.ts \
              backend/test/admin-user-list-ui.test.ts \
              backend/test/admin-user-list.test.ts \
              supabase/functions/api/shared/lib/admin-user-list-ui.ts \
              supabase/functions/api/shared/services/admin-user-list.ts
            git commit -m "style: format admin user browser"
            git push origin HEAD:validation/admin-panel-ci
          fi

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Admin regression tests
        run: npm --prefix backend test -- test/admin-user-list.test.ts test/admin-user-list-ui.test.ts test/edge-parity.test.ts

      - name: Full backend suite
        run: npm --prefix backend test

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Backend build
        run: npm --prefix backend run build

      - name: Frontend test suite
        run: npm test

      - name: Edge suite
        run: npm run test:edge

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
