name: Admin Panel Validation

on:
  push:
    branches:
      - validation/admin-panel-ci

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Admin regression tests
        run: npm --prefix backend test -- test/admin-user-list.test.ts test/admin-user-list-ui.test.ts test/edge-parity.test.ts

      - name: Full backend suite
        run: npm --prefix backend test

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Backend build
        run: npm --prefix backend run build

      - name: Frontend test suite
        run: npm test

      - name: Edge suite
        run: npm run test:edge

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
